[package]
name        = "Lyric.Mq.ActiveMq"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Apache ActiveMQ backend for the Lyric Mq.MessageQueue and Mq.QueueConsumer interfaces: a pure-Lyric STOMP 1.2 client over TCP or TLS."
targets     = ["dotnet", "jvm"]

[project]
name            = "Lyric.Mq.ActiveMq"
output          = "single"
output_assembly = "Mq.ActiveMq.dll"

[project.packages]
"Mq.ActiveMq"        = "src/activemq.l"
"Mq.ActiveMq.Extras" = "src/extras.l"
"Mq.ActiveMq.Stomp"  = "src/stomp.l"
"Mq.ActiveMq.Url"    = "src/url.l"

[project.tests]
"Mq.ActiveMq.StompTests"    = "tests/stomp_tests.l"
"Mq.ActiveMq.UrlTests"      = "tests/url_tests.l"
"Mq.ActiveMq.ExtrasTests"   = "tests/extras_tests.l"
"Mq.ActiveMq.ReexportTests" = "tests/reexport_tests.l"
# The client against an in-process STOMP broker on a loopback socket.
"Mq.ActiveMq.ClientTests"   = "tests/client_tests.l"
# Needs a real ActiveMQ: file-level `@cfg(feature = "integration")`, so a plain
# `lyric test` reports the module as gated and stays hermetic.
"Mq.ActiveMq.IntegrationTests" = "tests/integration/activemq_integration_tests.l"

[features]
default     = []
integration = []   # run tests/integration against the broker named by LYRIC_ACTIVEMQ_URL and LYRIC_ACTIVEMQ_TLS_*

[dependencies]
# The interface and its conformance suite, resolved through the root
# [workspace.overrides].
"Lyric.Testing" = { workspace = true }
"Lyric.Mq"      = { workspace = true }
# The TCP and TLS connection, the TLS options and URL authority parsing shared
# with the other protocol clients of this repository.
"Lyric.Net"     = { workspace = true }
