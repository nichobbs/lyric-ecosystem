[package]
name        = "Lyric.Mq.RabbitMq"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "RabbitMQ backend for the Lyric Mq.MessageQueue and Mq.QueueConsumer interfaces: a pure-Lyric AMQP 0-9-1 client over TCP or TLS."
targets     = ["dotnet", "jvm"]

[project]
name            = "Lyric.Mq.RabbitMq"
output          = "single"
output_assembly = "Mq.RabbitMq.dll"

[project.packages]
"Mq.RabbitMq"        = "src/rabbitmq.l"
"Mq.RabbitMq.Extras" = "src/extras.l"
"Mq.RabbitMq.Amqp"   = "src/amqp.l"
"Mq.RabbitMq.Url"    = "src/url.l"

[project.tests]
"Mq.RabbitMq.AmqpTests"     = "tests/amqp_tests.l"
"Mq.RabbitMq.UrlTests"      = "tests/url_tests.l"
"Mq.RabbitMq.ExtrasTests"   = "tests/extras_tests.l"
"Mq.RabbitMq.ReexportTests" = "tests/reexport_tests.l"
# The client against an in-process AMQP broker on a loopback socket.
"Mq.RabbitMq.ClientTests"   = "tests/client_tests.l"
# Needs a real RabbitMQ: file-level `@cfg(feature = "integration")`, so a plain
# `lyric test` reports the module as gated and stays hermetic.
"Mq.RabbitMq.IntegrationTests" = "tests/integration/rabbitmq_integration_tests.l"

[features]
default     = []
integration = []   # run tests/integration against the broker named by LYRIC_RABBITMQ_URL and LYRIC_RABBITMQ_TLS_*

[dependencies]
# The interface and its conformance suite, resolved through the root
# [workspace.overrides].
"Lyric.Conformance" = { workspace = true }
"Lyric.Mq"      = { workspace = true }
# The TCP and TLS connection, the TLS options and URL authority parsing shared
# with the other protocol clients of this repository.
"Lyric.Net"     = { workspace = true }
