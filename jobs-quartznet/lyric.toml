[package]
name        = "Lyric.Jobs.QuartzNet"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Quartz.NET backend for the Lyric Jobs.JobScheduler interface (.NET only)."
targets     = ["dotnet"]

[project]
name            = "Lyric.Jobs.QuartzNet"
output          = "single"
output_assembly = "Jobs.QuartzNet.dll"

[project.packages]
"Jobs.QuartzNet"               = "src/jobs_quartznet.l"
"Jobs.QuartzNet.Triggers"      = "src/triggers.l"
"Jobs.QuartzNet.Kernel.Dotnet" = "src/_kernel_dotnet/quartznet_kernel.l"

[project.tests]
"Jobs.QuartzNet.TriggersTests"         = "tests/triggers_tests.l"
"Jobs.QuartzNet.ConformanceTests"      = "tests/conformance_tests.l"
"Jobs.QuartzNet.ExecutionTests"        = "tests/execution_tests.l"
"Jobs.QuartzNet.TriggerExecutionTests" = "tests/trigger_execution_tests.l"

[dependencies]
# The interface and its conformance suite, resolved through the root
# [workspace.overrides].
"Lyric.Conformance" = { workspace = true }
"Lyric.Jobs"       = { workspace = true }

[nuget]
# Quartz.NET (RAMJobStore, DedicatedThreadPool). .NET only.
"Quartz" = "3.22.10"
