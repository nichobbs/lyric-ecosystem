[package]
name        = "Lyric.Aws.SigV4"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "AWS Signature Version 4 in pure Lyric: canonical requests, header and query-string signing for any AWS service, and credentials from the standard environment variables."
targets     = ["dotnet", "jvm", "native"]

[project]
name            = "Lyric.Aws.SigV4"
output          = "single"
output_assembly = "Aws.SigV4.dll"

[project.packages]
"Aws.SigV4"     = "src/sigv4.l"
"Aws.SigV4.Env" = "src/env.l"

[project.tests]
"Aws.SigV4.Tests"    = "tests/sigv4_tests.l"
"Aws.SigV4.EnvTests" = "tests/env_tests.l"
"Aws.SigV4.ReadmeTests" = "tests/readme_tests.l"

[dependencies]
