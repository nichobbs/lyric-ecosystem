[package]
name        = "Lyric.Net"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "TCP and TLS client connections for protocol clients written in Lyric: timed reads and writes, TLS options with the Std.Http names, and URL authority parsing."
targets     = ["dotnet", "jvm", "native"]

[project]
name            = "Lyric.Net"
output          = "single"
output_assembly = "Net.dll"

[project.packages]
"Net.Tcp"         = "src/tcp.l"
# Test support: listening sockets, server-side TLS and background threads for
# in-process servers.
"Net.Tcp.Testing" = "src/tcp_testing.l"
"Net.Threads"     = "src/threads.l"
"Net.Tls"         = "src/tls.l"
"Net.Url"         = "src/url.l"
# One package in three files: the socket and TLS boundary for each target, the
# only files with externs. Each file carries a file-level `@cfg(target = ...)`,
# so exactly one survives a build.
"Net.Tcp.Kernel" = [
  "src/_kernel_dotnet/tcp_kernel.l",
  "src/_kernel_jvm/tcp_kernel.l",
  "src/_kernel_native/tcp_kernel.l",
]

[project.tests]
"Net.Tcp.Tests" = "tests/tcp_tests.l"
"Net.Tls.Tests" = "tests/tls_tests.l"
"Net.Url.Tests" = "tests/url_tests.l"
# The README examples, compiled and run.
"Net.ReadmeTests" = "tests/readme_tests.l"

[dependencies]
