[package]
name        = "Lyric.Mq.Sqs"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "Amazon SQS backend for the Lyric Mq.MessageQueue and Mq.QueueConsumer interfaces, in pure Lyric (AWS JSON 1.0 over Std.Http, signed with SigV4)."
targets     = ["dotnet", "jvm", "native"]

[project]
name            = "Lyric.Mq.Sqs"
output          = "single"
output_assembly = "Mq.Sqs.dll"

[project.packages]
"Mq.Sqs"        = "src/sqs.l"
"Mq.Sqs.Client" = "src/client.l"
"Mq.Sqs.Extras" = "src/extras.l"
"Mq.Sqs.Address" = "src/address.l"
"Mq.Sqs.Wire"   = "src/wire.l"
# Mq.Sqs.Text is one package in two files: a String is UTF-16 code units on
# the managed targets and UTF-8 bytes on native.
"Mq.Sqs.Text"   = [
  "src/text_utf16.l",
  "src/text_utf8.l",
]

[project.tests]
"Mq.Sqs.AddressTests" = "tests/address_tests.l"
"Mq.Sqs.WireTests"    = "tests/wire_tests.l"
"Mq.Sqs.ConfigTests"  = "tests/config_tests.l"
"Mq.Sqs.ReexportTests" = "tests/reexport_tests.l"
"Mq.Sqs.ReadmeTests" = "tests/readme_tests.l"
# The conformance suite and the backend's own behaviour over real HTTP, against
# an in-process SQS server (tests/fake_sqs_tests.l) that verifies every signature.
"Mq.Sqs.FakeSqsTests" = "tests/fake_sqs_tests.l"
# Needs a real SQS-compatible server: file-level `@cfg(feature = "integration")`,
# so a plain `lyric test` reports the module as gated and stays hermetic.
"Mq.Sqs.IntegrationTests" = "tests/integration/sqs_integration_tests.l"

[features]
default     = []
integration = []   # run tests/integration against the server named by LYRIC_SQS_ENDPOINT

[dependencies]
# The interface and its conformance suite, resolved through the root
# [workspace.overrides].
"Lyric.Conformance" = { workspace = true }
"Lyric.Mq"        = { workspace = true }
# AWS Signature Version 4, shared with the other AWS backends in this repository.
"Lyric.Aws.SigV4" = { workspace = true }
# Credential providers (environment, shared files, container, IMDS, web
# identity, the default chain, the refreshing cache) and the retry policy.
"Lyric.Aws.Credentials" = { workspace = true }
