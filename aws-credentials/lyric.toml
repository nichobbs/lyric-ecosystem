[package]
name        = "Lyric.Aws.Credentials"
version     = "0.1.0"
stability   = "experimental"
authors     = ["Lyric Contributors"]
license     = "MIT"
description = "AWS credential providers (environment, shared config and credentials files, credential_process, container, IMDSv2, web identity, the default chain, a refreshing cache) and the standard retry policy, in pure Lyric."
targets     = ["dotnet", "jvm"]

[project]
name            = "Lyric.Aws.Credentials"
output          = "single"
output_assembly = "Aws.Credentials.dll"

[project.packages]
"Aws.Credentials"         = "src/credentials.l"
"Aws.Credentials.Ini"     = "src/ini.l"
"Aws.Credentials.Profile" = "src/profile.l"
"Aws.Credentials.Remote"  = "src/remote.l"
"Aws.Credentials.Chain"   = "src/chain.l"
"Aws.Retry"               = "src/retry.l"

[project.tests]
"Aws.Credentials.IniTests"      = "tests/ini_tests.l"
"Aws.Credentials.CoreTests"     = "tests/core_tests.l"
"Aws.Credentials.ProfileTests"  = "tests/profile_tests.l"
"Aws.Credentials.RemoteTests"   = "tests/remote_tests.l"
"Aws.Retry.Tests"               = "tests/retry_tests.l"
"Aws.Credentials.ReadmeTests"   = "tests/readme_tests.l"
# Needs the AWS Emulator: file-level `@cfg(feature = "integration")`, so a
# plain `lyric test` reports the module as gated and stays hermetic.
"Aws.Credentials.IntegrationTests" = "tests/integration/emulator_integration_tests.l"

[features]
default     = []
integration = []   # run tests/integration against the emulator named by AWS_EMULATOR_CONFIG_FILE

[dependencies]
# AWS Signature Version 4 and its `Credentials` record, shared with the AWS
# backends in this repository.
"Lyric.Aws.SigV4" = { workspace = true }
