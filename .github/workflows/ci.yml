name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hermetic suites: every package on exactly the targets it claims.
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [dotnet, jvm]
    steps:
      - name: Check out lyric-ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lyric-ecosystem

      - name: Set up Lyric
        uses: ./lyric-ecosystem/.github/actions/setup-lyric

      - name: Check formatting
        if: matrix.target == 'dotnet'
        working-directory: lyric-ecosystem
        run: bash scripts/ci/check-format.sh

      - name: Test packages
        working-directory: lyric-ecosystem
        run: bash scripts/ci/test-packages.sh ${{ matrix.target }}

  # Suites that need a real service (`--features integration`), against
  # disposable service containers.
  integration:
    name: integration (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [dotnet, jvm]
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LYRIC_REDIS_URL: redis://127.0.0.1:6379
      LYRIC_S3_ENDPOINT: http://127.0.0.1:9000
      LYRIC_S3_BUCKET: lyric-it
      LYRIC_S3_REGION: us-east-1
    steps:
      - name: Check out lyric-ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lyric-ecosystem

      - name: Set up Lyric
        uses: ./lyric-ecosystem/.github/actions/setup-lyric

      - name: Cache the MinIO build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lyric-ci/minio
          key: minio-${{ runner.os }}-${{ hashFiles('lyric-ecosystem/scripts/ci/start-minio.sh') }}

      - name: Start MinIO
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-minio.sh

      - name: Cache the ElasticMQ jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lyric-ci/elasticmq
          key: elasticmq-${{ runner.os }}-${{ hashFiles('lyric-ecosystem/scripts/ci/start-elasticmq.sh') }}

      # After MinIO: it keeps the AWS credentials MinIO exported.
      - name: Start ElasticMQ
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-elasticmq.sh

      - name: Start RabbitMQ
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-rabbitmq.sh

      - name: Start ActiveMQ
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-activemq.sh

      - name: Start Redis with TLS
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-redis-tls.sh

      - name: Cache Azurite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lyric-ci/azurite
          key: azurite-${{ runner.os }}-${{ hashFiles('lyric-ecosystem/scripts/ci/start-azurite.sh') }}

      - name: Start Azurite
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-azurite.sh

      - name: Cache the Flipt binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lyric-ci/flipt
          key: flipt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lyric-ecosystem/scripts/ci/start-flipt.sh') }}

      - name: Start Flipt
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-flipt.sh

      - name: Start memcached
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-memcached.sh

      # SQLite is a library, not a server: this puts the native e_sqlite3 from
      # the NuGet cache on the library path (lyric-lang#9095) and makes a
      # database directory.
      - name: Prepare SQLite for jobs-hangfire
        if: matrix.target == 'dotnet'
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-hangfire-sqlite.sh

      - name: Test packages against the services
        working-directory: lyric-ecosystem
        run: bash scripts/ci/test-packages.sh ${{ matrix.target }} --integration

      # No emulator speaks the Cloud Storage XML API with HMAC signing, and there
      # is no key in CI, so this is the only run against Google itself: requests
      # signed with a non-existent key (refused; Google echoes how it read them)
      # and anonymous reads of Google's public buckets.
      - name: storage-gcs against storage.googleapis.com (no credentials)
        working-directory: lyric-ecosystem
        run: |
          "$LYRIC" restore --manifest storage-gcs/lyric.toml
          "$LYRIC" test --manifest storage-gcs/lyric.toml --target ${{ matrix.target }} --features live

  # A second server for the two AWS backends. Unlike ElasticMQ it verifies
  # SigV4 signatures against a key it generates for the run, and it follows
  # Amazon's behaviour where MinIO differs (CreateBucket of an owned bucket in
  # us-east-1). It is a separate job because it sets the same endpoint
  # variables as MinIO and ElasticMQ.
  aws-emulator:
    name: aws-emulator (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [dotnet, jvm]
    steps:
      - name: Check out lyric-ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lyric-ecosystem

      - name: Set up Lyric
        uses: ./lyric-ecosystem/.github/actions/setup-lyric

      - name: Cache the AWS Emulator package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lyric-ci/aws-emulator
          key: aws-emulator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lyric-ecosystem/scripts/ci/start-aws-emulator.sh') }}

      - name: Start AWS Emulator
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-aws-emulator.sh

      - name: mq-sqs and storage-s3 against AWS Emulator
        working-directory: lyric-ecosystem
        run: bash scripts/ci/test-aws-emulator.sh ${{ matrix.target }}

  # The packages that claim `native` in `[package] targets`, built with the
  # LLVM backend and run as native executables, then the ones with an
  # integration suite against real services.
  native:
    name: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LYRIC_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out lyric-ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lyric-ecosystem

      - name: Set up Lyric
        uses: ./lyric-ecosystem/.github/actions/setup-lyric

      - name: Build the native runtime
        run: |
          clang --version
          make -C lyric-lang/lyric-rt

      - name: Test packages on native
        working-directory: lyric-ecosystem
        run: bash scripts/ci/test-native.sh

      - name: Start Redis with TLS
        working-directory: lyric-ecosystem
        run: bash scripts/ci/start-redis-tls.sh

      - name: Test packages on native against the services
        working-directory: lyric-ecosystem
        run: bash scripts/ci/test-native.sh --integration
