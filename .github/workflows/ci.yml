name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Hermetic suites: every package on exactly the targets it claims.
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [dotnet, jvm]
    steps:
      - name: Check out lyric-ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lyric-ecosystem

      - name: Set up Lyric
        uses: ./lyric-ecosystem/.github/actions/setup-lyric

      - name: Check formatting
        if: matrix.target == 'dotnet'
        working-directory: lyric-ecosystem
        run: bash scripts/ci/check-format.sh

      - name: Test packages
        working-directory: lyric-ecosystem
        run: bash scripts/ci/test-packages.sh ${{ matrix.target }}
