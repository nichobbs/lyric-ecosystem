name: Set up Lyric
description: >
  Checks out nichobbs/lyric-lang next to this repository at the commit pinned in
  .lyric-lang-rev (the interface packages and conformance suites resolve against
  it through [workspace.overrides]) and builds the lyric compiler from that same
  commit, cached per commit. Expects this repository checked out at
  ./lyric-ecosystem. Exports LYRIC and LYRIC_MAVEN_RESOLVER.

runs:
  using: composite
  steps:
    - name: Read the pinned lyric-lang commit
      id: pin
      shell: bash
      run: echo "rev=$(tr -d '[:space:]' < lyric-ecosystem/.lyric-lang-rev)" >> "$GITHUB_OUTPUT"

    - name: Check out lyric-lang at the pinned commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: nichobbs/lyric-lang
        ref: ${{ steps.pin.outputs.rev }}
        path: lyric-lang

    - name: Set up .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: lyric-lang/bootstrap/global.json

    - name: Set up Java 22
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '22'

    - name: Cache the compiler build
      id: toolchain-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lyric-lang/.bootstrap
          lyric-lang/bin
          lyric-lang/bootstrap/src/Lyric.Cli.Aot/bin
          lyric-lang/bootstrap/src/Lyric.Cli.Aot/obj
          lyric-lang/resolver/target/lyric-resolver.jar
        key: lyric-toolchain-${{ runner.os }}-${{ steps.pin.outputs.rev }}

    - name: Build the compiler and the Maven resolver
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: lyric-lang
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SKIP_SELFHOSTED_COMPILER: '1'
      run: |
        make lyric
        make maven-resolver

    - name: Export the toolchain
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/lyric-lang/bin/lyric" --version
        echo "LYRIC=$GITHUB_WORKSPACE/lyric-lang/bin/lyric" >> "$GITHUB_ENV"
        echo "LYRIC_MAVEN_RESOLVER=$GITHUB_WORKSPACE/lyric-lang/resolver/target/lyric-resolver.jar" >> "$GITHUB_ENV"
